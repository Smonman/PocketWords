rootLogger=DEBUG, STDOUT, LOGFILE
# Appender 1: STDOUT
appender.console.name=STDOUT
appender.console.type=Console
appender.console.follow=true
appender.console.layout.type=PatternLayout
appender.console.layout.patternSelector.type=MarkerPatternSelector
appender.console.layout.patternSelector.defaultPattern=%style{%d{yyyy-MM-dd HH:mm:ss.SSS}}{white} %style{%6r ms}{white} %highlight{%5p} %style{---}{white} %style{[%10.10t]}{white} %style{%-40.40logger{1.}}{cyan} %style{:}{white} %m%n%throwable
appender.console.layout.patternSelector.patternMatch.type=PatternMatch
appender.console.layout.patternSelector.patternMatch.key=OUTPUT
appender.console.layout.patternSelector.patternMatch.pattern=%m%n
# Appender 2: LOGFILE
appender.file.name=LOGFILE
appender.file.type=File
appender.file.fileName=logs/${project.name}.log
appender.file.append=false
appender.file.layout.type=PatternLayout
appender.file.layout.patternSelector.type=MarkerPatternSelector
appender.file.layout.patternSelector.defaultPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %6r ms %-10.10p [%15.15t] %-40.40logger{39} %-20.20method : %m%n%xEx{full}
appender.file.layout.patternSelector.patternMatch.type=PatternMatch
appender.file.layout.patternSelector.patternMatch.key=OUTPUT
appender.file.layout.patternSelector.patternMatch.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %6r ms %-10.10marker [%15.15t] %-40.40logger{39} %-20.20method : %m%n
appender.file.filter.threshold.type=ThresholdFilter
appender.file.filter.threshold.level=debug
